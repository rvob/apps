<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Página Não Encontrada</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --bg: #08090d;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border-color: rgba(255, 255, 255, 0.1);
      --text-main: #ffffff;
      --text-muted: #9da3b0;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% -10%, rgba(110, 30, 180, .20), transparent 40%), var(--bg);
      color: var(--text-main);
      font-family: 'Poppins', sans-serif;
      padding: 20px 14px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 32px 20px;
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      animation: cardIn .4s ease both;
    }

    .icon-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      margin-bottom: 16px;
      border-radius: 22px;
      background: linear-gradient(135deg, #7b1bc2, #3c0870);
      box-shadow: 0 8px 25px rgba(105, 20, 180, .4);
      font-size: 30px;
      animation: logoFloat 4s ease-in-out infinite;
    }

    .error-code {
      font-size: clamp(54px, 12vw, 72px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #ffffff, #b96df2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    p {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 13px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, filter 0.2s, box-shadow 0.2s;
      background: linear-gradient(135deg, #7414a9, #4c0878);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .25);
    }

    .btn-home:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
      box-shadow: 0 10px 25px rgba(105, 20, 180, .4);
    }

    .btn-home:active {
      transform: scale(.98);
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .container {
        padding: 24px 16px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="icon-box">
      <i class="fa-solid fa-link-slash"></i>
    </div>
    
    <div class="error-code">404</div>
    <h1>Página Não Encontrada</h1>
    <p>O link que você tentou acessar não existe ou foi removido.</p>

    <a href="index.html" class="btn-home">
      <i class="fa-solid fa-house"></i> Voltar ao Início
    </a>
  </div>

</body>
</html>
