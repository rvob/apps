<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Links M3U</title>

<!-- PWA & Mobile Settings -->
<meta name="theme-color" content="#08090d" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Links M3U" />

<link rel="icon" type="image/svg+xml" href="/m3u/favicon.svg">
<link rel="apple-touch-icon" href="/m3u/icon-192.png">

<!-- Manifest PWA -->
<link rel="manifest" href="/m3u/manifest.json">

<!-- Fonts e ícones -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
  :root {
    --bg: #08090d;
    --card-bg: rgba(255, 255, 255, 0.03);
    --input-bg: rgba(0, 0, 0, 0.35);
    --border-color: rgba(255, 255, 255, 0.1);
    --text-main: #ffffff;
    --text-muted: #9da3b0;
    --accent: #22B8A3;
    --accent-strong: #086F5F;
    --radius: 14px;
    color-scheme: dark;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #eef1f4;
      --card-bg: #ffffff;
      --input-bg: #f3f5f7;
      --border-color: rgba(15, 23, 32, 0.12);
      --text-main: #10151c;
      --text-muted: #5b6472;
      --accent: #0e8f79;
      --accent-strong: #086F5F;
      color-scheme: light;
    }
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
  }

  body {
    background: radial-gradient(circle at 15% 0%, color-mix(in srgb, var(--accent) 18%, transparent) 0%, var(--bg) 45%);
    background-repeat: no-repeat;
    background-color: var(--bg);
    background-attachment: fixed;
    color: var(--text-main);
    font-family: 'Poppins', sans-serif;
    padding: 16px 12px calc(16px + env(safe-area-inset-bottom));
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-tap-highlight-color: transparent;
  }

  .container {
    width: 100%;
    max-width: 600px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    padding: 16px;
    border-radius: var(--radius);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    height: fit-content;
  }

  header {
    text-align: center;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-strong));
    box-shadow: 0 4px 15px rgba(34, 184, 163, .35);
    font-size: 16px;
    color: #ffffff;
  }

  h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -.5px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }

  label {
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 4px;
    display: block;
  }

  input {
    width: 100%;
    background-color: var(--input-bg);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 16px; /* evita zoom automático no iOS */
    font-family: 'Poppins', sans-serif;
    outline: none;
    transition: border-color 0.2s;
    min-height: 44px;
  }

  input:focus {
    border-color: var(--accent);
  }

  .btn, .btn-limpar {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .btn {
    width: 100%;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 12px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, filter 0.2s;
    background: linear-gradient(135deg, #10b981, #047857);
    color: #ffffff;
    box-shadow: 0 4px 15px rgba(0, 0, 0, .2);
    min-height: 46px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn:active {
    transform: scale(.98);
  }

  .acoes-grid {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: stretch;
  }

  .btn-limpar {
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    background: var(--input-bg);
    color: var(--text-main);
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 46px;
  }

  .btn-limpar:active {
    transform: scale(.98);
  }

  .aviso {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(239, 68, 68, 0.12);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #ff9c9c;
    font-size: 0.8rem;
    display: none;
    align-items: center;
    gap: 8px;
  }

  .aviso.visivel {
    display: flex;
  }

  #resultado {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .grupo-site {
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .titulo-site {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border-color);
  }

  .titulo-nome {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }

  .titulo-nome span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .copiar-tudo-btn {
    background: var(--card-bg);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 0.68rem;
    font-weight: 600;
    cursor: pointer;
    text-transform: none;
    letter-spacing: normal;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
    min-height: 30px;
  }

  .copiar-tudo-btn.copiado {
    background: linear-gradient(135deg, #10b981, #047857);
    border-color: transparent;
    color: #fff;
  }

  .linha {
    background-color: var(--card-bg);
    padding: 10px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    border: 1px solid var(--border-color);
  }

  .texto-container {
    flex: 1;
    min-width: 0;
  }

  .label-tipo {
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--text-muted);
    line-height: 1;
    margin-bottom: 4px;
    display: block;
  }

  .texto-link {
    font-family: 'SFMono-Regular', Menlo, Consolas, monospace;
    font-size: 0.78rem;
    color: var(--text-main);
    white-space: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-user-select: all;
    user-select: all;
    cursor: text;
    padding-bottom: 2px;
  }

  .texto-link::-webkit-scrollbar {
    display: none;
  }

  .copiar-btn {
    background: linear-gradient(135deg, #0796d5, #045d9a);
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    min-height: 36px;
    touch-action: manipulation;
  }

  .copiar-btn.copiado {
    background: linear-gradient(135deg, #10b981, #047857);
  }

  @media (max-width: 380px) {
    .form-grid {
      grid-template-columns: 1fr;
    }
  }

  footer {
    width: 100%;
    max-width: 600px;
    text-align: center;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border-color);
    color: var(--text-muted);
    font-size: 12px;
  }

  footer a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
  }

  footer a:hover {
    color: var(--accent-strong);
  }

  /* toast de fallback quando o navegador bloqueia a área de transferência */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translate(-50%, 12px);
    background: #10151c;
    color: #fff;
    border: 1px solid rgba(255,255,255,0.15);
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 0.8rem;
    max-width: 90vw;
    text-align: center;
    box-shadow: 0 8px 25px rgba(0,0,0,0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 50;
  }

  .toast.visivel {
    opacity: 1;
    transform: translate(-50%, 0);
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <i class="fa-solid fa-link"></i>
      </div>
      <h1>Links M3U</h1>
    </header>

    <div class="form-grid">
      <div>
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" placeholder="Usuário" autocomplete="username" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" />
      </div>

      <div>
        <label for="senha">Senha</label>
        <input type="text" id="senha" placeholder="Senha" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
      </div>
    </div>

    <div class="acoes-grid">
      <button class="btn" id="btnGerar">
        <i class="fa-solid fa-bolt"></i> Gerar Links
      </button>
      <button class="btn-limpar" id="btnLimpar" aria-label="Limpar campos e dados salvos">
        <i class="fa-solid fa-eraser"></i> Limpar
      </button>
    </div>

    <div class="aviso" id="aviso">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <span>Preencha o usuário e a senha para gerar os links.</span>
    </div>

    <div id="resultado"></div>
  </div>

  <footer>
    © 2026 — Desenvolvido com IA por <a href="https://wa.me/+5574991162482" target="_blank" rel="noopener noreferrer">Rangel Viana</a>
  </footer>

  <div class="toast" id="toast"></div>

  <script>
    const inputUsuario = document.getElementById('usuario');
    const inputSenha = document.getElementById('senha');
    const aviso = document.getElementById('aviso');
    const toastEl = document.getElementById('toast');
    const resultadoDiv = document.getElementById('resultado');

    const SITES = [
      "clubneymar.com",
      "diogoguido.com",
      "mevergiveupp.com",
      "phn35.xyz",
      "uabckiac.com",
      "ueropqe.com"
    ];

    let toastTimeout;
    function mostrarToast(texto) {
      clearTimeout(toastTimeout);
      toastEl.textContent = texto;
      toastEl.classList.add('visivel');
      toastTimeout = setTimeout(() => toastEl.classList.remove('visivel'), 2200);
    }

    // Copia texto com fallback para contextos sem navigator.clipboard
    // (comum em navegadores mobile fora de HTTPS ou dentro de webviews).
    async function copiarTexto(texto) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(texto);
          return true;
        }
        throw new Error('clipboard API indisponível');
      } catch (e) {
        // Fallback: cria um campo temporário, seleciona e usa execCommand
        try {
          const textarea = document.createElement('textarea');
          textarea.value = texto;
          textarea.style.position = 'fixed';
          textarea.style.top = '-9999px';
          textarea.style.left = '-9999px';
          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();
          textarea.setSelectionRange(0, texto.length);
          const ok = document.execCommand('copy');
          document.body.removeChild(textarea);
          if (ok) return true;
        } catch (e2) { /* segue para aviso manual */ }
        mostrarToast('Não foi possível copiar automaticamente. Toque no link para selecioná-lo e copie manualmente.');
        return false;
      }
    }

    function limparCampos() {
      inputUsuario.value = '';
      inputSenha.value = '';
      resultadoDiv.innerHTML = '';
      aviso.classList.remove('visivel');
      localStorage.removeItem('m3u-credenciais');
      inputUsuario.focus();
    }

    function mostrarAviso(mostrar) {
      aviso.classList.toggle('visivel', mostrar);
    }

    function criarLinhaLink(item) {
      const linha = document.createElement('div');
      linha.className = 'linha';

      const container = document.createElement('div');
      container.className = 'texto-container';

      const labelTipo = document.createElement('span');
      labelTipo.className = 'label-tipo';
      labelTipo.textContent = item.tipo;

      const textoLink = document.createElement('div');
      textoLink.className = 'texto-link';
      textoLink.textContent = item.url;
      textoLink.title = 'Toque para selecionar';

      container.appendChild(labelTipo);
      container.appendChild(textoLink);

      const botao = document.createElement('button');
      botao.type = 'button';
      botao.className = 'copiar-btn';
      botao.innerHTML = '<i class="fa-regular fa-copy"></i> Copiar';

      botao.addEventListener('click', async () => {
        const sucesso = await copiarTexto(item.url);
        if (sucesso) {
          botao.innerHTML = '<i class="fa-solid fa-check"></i> OK!';
          botao.classList.add('copiado');
          setTimeout(() => {
            botao.innerHTML = '<i class="fa-regular fa-copy"></i> Copiar';
            botao.classList.remove('copiado');
          }, 1500);
        }
      });

      // Toque no próprio texto também seleciona tudo, facilitando copiar manual no celular
      textoLink.addEventListener('click', () => {
        const range = document.createRange();
        range.selectNodeContents(textoLink);
        const selecao = window.getSelection();
        selecao.removeAllRanges();
        selecao.addRange(range);
      });

      linha.appendChild(container);
      linha.appendChild(botao);
      return linha;
    }

    function criarGrupoSite(site, usuario, senha) {
      const siteLimpo = site.replace(/\/$/, '');

      const itens = [
        { tipo: 'M3U', url: `http://${siteLimpo}/get.php?username=${encodeURIComponent(usuario)}&password=${encodeURIComponent(senha)}&type=m3u_plus&output=ts` },
        { tipo: 'EPG', url: `http://${siteLimpo}/epg/${encodeURIComponent(usuario)}/${encodeURIComponent(senha)}` }
      ];

      const grupo = document.createElement('div');
      grupo.className = 'grupo-site';

      const titulo = document.createElement('div');
      titulo.className = 'titulo-site';

      const nome = document.createElement('span');
      nome.className = 'titulo-nome';
      nome.innerHTML = `<i class="fa-solid fa-globe"></i> <span>${siteLimpo}</span>`;

      const botaoTudo = document.createElement('button');
      botaoTudo.type = 'button';
      botaoTudo.className = 'copiar-tudo-btn';
      botaoTudo.innerHTML = '<i class="fa-regular fa-copy"></i> Copiar tudo';

      botaoTudo.addEventListener('click', async () => {
        const textoCompleto = itens.map(i => `${i.tipo}: ${i.url}`).join('\n');
        const sucesso = await copiarTexto(textoCompleto);
        if (sucesso) {
          botaoTudo.innerHTML = '<i class="fa-solid fa-check"></i> Copiado!';
          botaoTudo.classList.add('copiado');
          setTimeout(() => {
            botaoTudo.innerHTML = '<i class="fa-regular fa-copy"></i> Copiar tudo';
            botaoTudo.classList.remove('copiado');
          }, 1500);
        }
      });

      titulo.appendChild(nome);
      titulo.appendChild(botaoTudo);
      grupo.appendChild(titulo);

      itens.forEach(item => grupo.appendChild(criarLinhaLink(item)));

      return grupo;
    }

    function gerarLinks() {
      const usuario = inputUsuario.value.trim();
      const senha = inputSenha.value.trim();

      resultadoDiv.innerHTML = '';

      if (!usuario || !senha) {
        mostrarAviso(true);
        return;
      }
      mostrarAviso(false);

      localStorage.setItem('m3u-credenciais', JSON.stringify({ usuario, senha }));

      const fragmento = document.createDocumentFragment();
      SITES.forEach(site => fragmento.appendChild(criarGrupoSite(site, usuario, senha)));
      resultadoDiv.appendChild(fragmento);
    }

    document.getElementById('btnGerar').addEventListener('click', gerarLinks);
    document.getElementById('btnLimpar').addEventListener('click', limparCampos);

    [inputUsuario, inputSenha].forEach(campo => {
      campo.addEventListener('keydown', e => {
        if (e.key === 'Enter') gerarLinks();
      });
    });

    window.addEventListener('DOMContentLoaded', () => {
      try {
        const salvo = JSON.parse(localStorage.getItem('m3u-credenciais') || 'null');
        if (salvo && salvo.usuario && salvo.senha) {
          inputUsuario.value = salvo.usuario;
          inputSenha.value = salvo.senha;
          gerarLinks();
        }
      } catch (e) { /* dados salvos inválidos, ignora */ }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/m3u/sw.js')
          .then(() => console.log('Service Worker registrado com sucesso'))
          .catch(err => console.log('Erro ao registrar Service Worker:', err));
      });
    }
  </script>
</body>
</html>
