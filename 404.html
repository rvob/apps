<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="language" content="pt-BR">
<meta name="geo.region" content="BR">

<title>Página não encontrada — Central de Aplicativos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
    --bg: #08090d;
    --text: #ffffff;
    --muted: #9da3b0;
    --radius: 16px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    font-family: 'Poppins', sans-serif;
    color: var(--text);
    background: radial-gradient(circle at 50% -10%, rgba(110, 30, 180, .20), transparent 40%), var(--bg);
    padding: 28px 18px 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 600px;
    margin: auto;
    text-align: center;
}

/* HEADER / ERRO 404 */
.error-code {
    font-size: clamp(80px, 15vw, 130px);
    font-weight: 700;
    line-height: 1;
    background: linear-gradient(135deg, #b96df2, #7b1bc2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
    letter-spacing: -2px;
}

.logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 64px;
    height: 64px;
    margin-bottom: 16px;
    border-radius: 18px;
    background: linear-gradient(135deg, #7b1bc2, #3c0870);
    box-shadow: 0 8px 25px rgba(105, 20, 180, .35);
    font-size: 26px;
    animation: logoFloat 4s ease-in-out infinite;
}

h1 {
    font-size: clamp(22px, 4vw, 30px);
    font-weight: 700;
    letter-spacing: -.5px;
    margin-bottom: 8px;
}

.subtitle {
    color: var(--muted);
    font-size: 15px;
    margin-bottom: 28px;
    line-height: 1.5;
}

/* BOTÃO DE RETORNO */
.btn-home {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 60px;
    padding: 14px 28px;
    border-radius: var(--radius);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    background: linear-gradient(135deg, #7414a9, #4c0878);
    border: 1px solid rgba(255, 255, 255, .15);
    box-shadow: 0 8px 25px rgba(116, 20, 169, .35);
    transition: transform .2s ease, filter .2s ease, box-shadow .2s ease;
    animation: cardIn .4s ease both;
}

.btn-home i {
    font-size: 18px;
}

.btn-home:hover {
    transform: translateY(-3px);
    filter: brightness(1.15);
    box-shadow: 0 12px 30px rgba(116, 20, 169, .5);
}

.btn-home:active {
    transform: scale(.98);
}

.btn-home:focus-visible {
    outline: none;
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 0 0 3px #fff, 0 0 0 6px #7832c8;
}

/* FOOTER */
footer {
    text-align: center;
    margin-top: 34px;
    padding-top: 20px;
    border-top: 1px solid rgba(255, 255, 255, .06);
    color: #737985;
    font-size: 12px;
}

footer a {
    color: #a867d4;
    text-decoration: none;
    font-weight: 500;
}

footer a:hover {
    color: #d39bf4;
}

/* ANIMAÇÕES */
@keyframes logoFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
}

@keyframes cardIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

@media(prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    
    <div class="error-code">404</div>

    <h1>Página não encontrada</h1>
    <p class="subtitle">O link que você tentou acessar não existe ou foi removido.</p>

    <a href="index.html" class="btn-home" aria-label="Voltar para a Central de Aplicativos">
        <i class="fa-solid fa-house"></i>
        <span>Voltar para o Início</span>
    </a>

</div>

<footer>
    © 2026 — Criado com ChatGPT por
    <a href="https://wa.me/+5574991162482" target="_blank" rel="noopener noreferrer">Rangel Viana</a>
</footer>

<script>
/* Foco automático e controle via TV/Teclado */
const btnHome = document.querySelector('.btn-home');

if (btnHome) {
    btnHome.focus();
}

document.addEventListener('keydown', (e) => {
    if (['ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown', 'Enter'].includes(e.key)) {
        if (document.activeElement !== btnHome) {
            btnHome.focus();
        }
    }
});
</script>

</body>
</html>
