<style>
:root {
    --bg: #08090d;
    --text: #ffffff;
    --muted: #9da3b0;
    --radius: 16px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    font-family: 'Poppins', sans-serif;
    color: var(--text);
    background: radial-gradient(circle at 50% -10%, rgba(110, 30, 180, .20), transparent 40%), var(--bg);
    padding: 28px 18px 20px;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 1050px;
    margin: 0 auto;
}

/* CABEÇALHO */
header {
    text-align: center;
    margin-bottom: 32px;
}

.logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 58px;
    height: 58px;
    margin-bottom: 12px;
    border-radius: 18px;
    background: linear-gradient(135deg, #7b1bc2, #3c0870);
    box-shadow: 0 8px 25px rgba(105, 20, 180, .35);
    font-size: 24px;
    animation: logoFloat 4s ease-in-out infinite;
}

h1 {
    font-size: clamp(24px, 4vw, 34px);
    font-weight: 700;
    letter-spacing: -.5px;
}

.subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-top: 4px;
}

.subtitle span {
    color: #b96df2;
}

/* GRID & BOTÕES */
.buttons-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
}

.button {
    display: flex;
    align-items: center;
    min-height: 80px;
    padding: 14px 18px;
    border-radius: var(--radius);
    color: #fff;
    text-decoration: none;
    border: 1px solid rgba(255, 255, 255, .1);
    box-shadow: 0 6px 20px rgba(0, 0, 0, .25);
    transition: transform .2s ease, filter .2s ease, box-shadow .2s ease;
}

/* Gradientes dos Botões */
.btn-purple { background: linear-gradient(135deg, #7414a9, #4c0878); }
.btn-blue   { background: linear-gradient(135deg, #0796d5, #045d9a); }
.btn-dark   { background: linear-gradient(135deg, #27303d, #121720); }
.btn-red    { background: linear-gradient(135deg, #f13339, #b30e19); }
.btn-indigo { background: linear-gradient(135deg, #5365dc, #303e9d); }
.btn-orange { background: linear-gradient(135deg, #ff8b19, #dc5900); }
.btn-yellow { background: linear-gradient(135deg, #f5a000, #c87a00); }
.btn-green  { background: linear-gradient(135deg, #10b981, #047857); }

.button:hover {
    transform: translateY(-3px);
    filter: brightness(1.1);
    box-shadow: 0 12px 28px rgba(0, 0, 0, .35);
}

.button:active {
    transform: scale(.98);
}

/* Foco para controle de TV / Teclado */
.button:focus-visible {
    outline: none;
    transform: translateY(-3px) scale(1.01);
    box-shadow: 0 0 0 3px #fff, 0 0 0 6px #7832c8;
}

/* ÍCONE E TEXTO */
.button i {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    border-radius: 12px;
    background: rgba(0, 0, 0, .2);
    border: 1px solid rgba(255, 255, 255, .1);
    font-size: 18px;
}

.btn-text {
    display: flex;
    flex-direction: column;
    margin-left: 14px;
    overflow: hidden;
}

.btn-text strong {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.btn-text small {
    margin-top: 2px;
    color: rgba(255, 255, 255, .75);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* FOOTER */
footer {
    text-align: center;
    margin-top: 34px;
    padding-top: 20px;
    border-top: 1px solid rgba(255, 255, 255, .06);
    color: #737985;
    font-size: 12px;
}

footer a {
    color: #a867d4;
    text-decoration: none;
    font-weight: 500;
}

footer a:hover {
    color: #d39bf4;
}

/* ANIMAÇÕES */
@keyframes logoFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
}

.button {
    animation: cardIn .4s ease both;
}

@keyframes cardIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ADAPTAÇÕES RESPONSIVAS */
@media(max-width: 600px) {
    body { padding: 20px 12px; }
    .buttons-grid { grid-template-columns: 1fr; gap: 12px; }
    .button { min-height: 72px; padding: 12px 14px; }
}

@media(min-width: 601px) and (max-width: 900px) {
    .buttons-grid { grid-template-columns: repeat(2, 1fr); }
}

@media(min-width: 1200px) {
    .buttons-grid { grid-template-columns: repeat(3, 1fr); }
}

@media(prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<script>
/* Controle de Navegação TV / Teclado */
const buttons = [...document.querySelectorAll('.button')];
let current = 0;

function focusButton(index) {
    if (!buttons.length) return;
    current = (index + buttons.length) % buttons.length;
    buttons[current].focus();
}

document.addEventListener('keydown', (e) => {
    if (!buttons.length) return;

    const navKeys = ['ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown'];
    if (!navKeys.includes(e.key)) return;

    e.preventDefault();

    if (document.activeElement === document.body) {
        focusButton(0);
        return;
    }

    const cols = window.innerWidth >= 1200 ? 3 : window.innerWidth >= 601 ? 2 : 1;

    if (e.key === 'ArrowRight') focusButton(current + 1);
    if (e.key === 'ArrowLeft')  focusButton(current - 1);
    if (e.key === 'ArrowDown')  focusButton(current + cols);
    if (e.key === 'ArrowUp')    focusButton(current - cols);
});
</script>
