<svg xmlns="http://www.w3.org/2000/svg" width="58" height="58" viewBox="0 0 58 58">
  <defs>
    <!-- Gradiente do fundo da logo -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22B8A3" />
      <stop offset="100%" stop-color="#086F5F" />
    </linearGradient>

    <!-- Sombra projetada (box-shadow) -->
    <filter id="logoShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12.5" flood-color="#22B8A3" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Quadrado com cantos arredondados e gradiente -->
  <rect x="0" y="0" width="58" height="58" rx="18" ry="18" fill="url(#logoGradient)" filter="url(#logoShadow)" />

  <!-- Ícone de Play centralizado (FontAwesome fa-play) -->
  <path d="M 23 18.5 C 23 17.5 24.1 16.9 25 17.4 L 38 25.9 C 38.8 26.4 38.8 27.6 38 28.1 L 25 36.6 C 24.1 37.1 23 36.5 23 35.5 Z" fill="#FFFFFF" />
</svg>
