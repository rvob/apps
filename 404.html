<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0E8F79">
    <title>Página não encontrada — 404</title>
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* =========================================================
           TOKENS DE DESIGN (mesma identidade do Gerador de Placa PIX)
        ========================================================= */
        :root {
            --primary: #22B8A3;
            --primary-dark: #0E8F79;
            --primary-deep: #086F5F;
            --primary-light: #E4FAF4;
            --gold: #F0B94F;

            --bg: #0A0E0F;
            --bg-radial: radial-gradient(circle at 15% 0%, #10312C 0%, #0A0E0F 45%);
            --panel: #12181A;
            --panel-2: #161D1F;
            --border: #223032;
            --border-soft: #1A2426;

            --ink: #0B1614;
            --muted: #7C8A8B;
            --muted-2: #A6B3B3;

            --radius-lg: 22px;
            --radius-md: 14px;
            --radius-sm: 9px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { color-scheme: dark; }

        body {
            min-height: 100vh;
            background: var(--bg-radial);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #ffffff;
            padding: 32px 20px;
            display: flex;
            flex-direction: column;
        }

        h1, h2, .brand-word { font-family: 'Manrope', 'Inter', sans-serif; }

        /* =========================================================
           TOPO
        ========================================================= */
        /* =========================================================
           CONTEÚDO CENTRAL
        ========================================================= */
        .main-wrap {
            flex: 1;
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
        }

        .error-panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.45);
            padding: clamp(32px, 6vw, 64px) clamp(24px, 6vw, 72px);
            max-width: 620px;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .error-panel::before {
            content: "";
            position: absolute;
            top: -60%;
            left: 50%;
            transform: translateX(-50%);
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, rgba(34, 184, 163, 0.16) 0%, transparent 70%);
            pointer-events: none;
        }

        .error-code {
            font-family: 'Manrope', sans-serif;
            font-size: clamp(72px, 16vw, 128px);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -3px;
            background: linear-gradient(135deg, var(--primary) 10%, var(--primary-deep) 90%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            margin-bottom: 8px;
        }

        .error-title {
            font-family: 'Manrope', sans-serif;
            font-size: clamp(19px, 3.4vw, 24px);
            font-weight: 800;
            letter-spacing: -0.2px;
            margin-bottom: 12px;
            position: relative;
        }

        .error-desc {
            font-size: 14.5px;
            font-weight: 500;
            color: var(--muted-2);
            line-height: 1.6;
            max-width: 420px;
            margin: 0 auto;
            position: relative;
        }

        /* =========================================================
           RESPONSIVIDADE
        ========================================================= */
        @media (max-width: 480px) {
            body { padding: 20px 12px; }
            .error-panel { padding: 32px 20px; border-radius: var(--radius-md); }
        }
    </style>
</head>

<body>

<div class="main-wrap">
    <div class="error-panel">
        <div class="error-code">404</div>
        <h2 class="error-title">Página não encontrada</h2>
        <p class="error-desc">O endereço acessado não existe ou foi movido.</p>
    </div>
</div>

</body>
</html>
