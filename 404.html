<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Página Não Encontrada</title>
  <style>
    :root {
      --bg: #0d0f12;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-bg: rgba(255, 255, 255, 0.07);
      --card-hover-border: rgba(59, 130, 246, 0.5);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      max-width: 440px;
      width: 100%;
      text-align: center;
      margin: auto;
    }

    .error-code {
      font-size: clamp(5rem, 15vw, 7.5rem);
      font-weight: 800;
      letter-spacing: -3px;
      background: linear-gradient(180deg, #ffffff 0%, #4b5563 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    .links-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .nav-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.25s ease;
      backdrop-filter: blur(10px);
    }

    .nav-button:hover, .nav-button:active {
      border-color: var(--card-hover-border);
      background-color: var(--card-hover-bg);
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .arrow {
      color: var(--text-muted);
      transition: transform 0.25s ease, color 0.25s ease;
    }

    .nav-button:hover .arrow {
      transform: translateX(4px);
      color: var(--accent);
    }

    footer {
      margin-top: 40px;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      padding: 16px 0;
    }

    footer a {
      color: var(--text-muted);
      text-decoration: underline;
      transition: color 0.2s ease;
    }

    footer a:hover {
      color: var(--text);
    }
  </style>
</head>
<body>

  <main class="container">
    <div class="error-code">404</div>
    <h1>Página não encontrada</h1>
    <p>O link que você tentou acessar não existe ou foi movido. Escolha uma das opções abaixo para continuar:</p>

    <nav class="links-grid">
      <!-- Ajuste os atributos href abaixo com os links reais das suas páginas -->
      <a href="/pix" class="nav-button">
        <span>⚡ Gerador Pix</span>
        <span class="arrow">→</span>
      </a>

      <a href="/" class="nav-button">
        <span>📱 Central de Apps</span>
        <span class="arrow">→</span>
      </a>

      <a href="/m3u" class="nav-button">
        <span>📺 Links M3U</span>
        <span class="arrow">→</span>
      </a>
    </nav>
  </main>

  <footer>
    © 2026 — Criado com ChatGPT por <a href="https://wa.me/+5574991162482" target="_blank" rel="noopener noreferrer">Rangel Viana</a>
  </footer>

</body>
</html>
