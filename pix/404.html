<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>404 - Página Não Encontrada | Gerador de Placa PIX</title>

    <!-- Fonte Inter para Legibilidade Superior (Mesma do original) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* =========================================================
           RESET E VARIÁVEIS DE DESIGN (Reutilizadas do original)
        ========================================================= */
        :root {
            --pix-primary: #32bcad;
            --pix-dark: #008774;
            --bg-dark: #121316;
            --panel-bg: #1c1e22;
            --text-muted: #9da4b0;
            --border-color: #2e323b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: var(--bg-dark);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #ffffff;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Evita scroll desnecessário na animação */
        }

        /* =========================================================
           LAYOUT PRINCIPAL 404
        ========================================================= */
        .error-container {
            text-align: center;
            max-width: 600px;
            width: 100%;
            padding: 40px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 10;
        }

        /* Animação sutil de fundo para dar estilo */
        .error-container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(135deg, var(--pix-primary), transparent 50%, var(--pix-dark));
            border-radius: 26px;
            z-index: -1;
            opacity: 0.3;
        }

        /* =========================================================
           ELEMENTOS VISUAIS
        ========================================================= */
        
        /* O grande número 404 */
        .error-code {
            font-size: 120px;
            font-weight: 900;
            line-height: 1;
            color: var(--pix-primary);
            background: linear-gradient(135deg, #ffffff 30%, var(--pix-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: -5px;
            position: relative;
            display: inline-block;
        }

        /* Ícone decorativo estilizado (simulando um elo PIX quebrado) */
        .broken-link-icon {
            font-size: 60px;
            margin-bottom: 20px;
            color: #ef4444; /* Vermelho para erro, mas sutil */
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 16px;
            color: #ffffff;
        }

        p {
            font-size: 16px;
            color: var(--text-muted);
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* =========================================================
           BOTÕES DE AÇÃO (Estilo do original)
        ========================================================= */
        .action-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .btn {
            height: 48px;
            padding: 0 30px;
            border: 0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none; /* Para links parecerem botões */
        }

        .btn-primary {
            background: var(--pix-primary);
            color: #0f1115;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--border-color);
            color: #ffffff;
        }

        .btn:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .btn-outline:hover {
            border-color: var(--pix-primary);
            color: var(--pix-primary);
            background: rgba(50, 188, 173, 0.05);
        }

        /* =========================================================
           RESPONSIVIDADE
        ========================================================= */
        @media (max-width: 600px) {
            .error-container {
                padding: 30px 20px;
                border-radius: 20px;
            }

            .error-code {
                font-size: 80px;
            }

            h1 {
                font-size: 22px;
            }

            p {
                font-size: 14px;
                margin-bottom: 30px;
            }

            .action-buttons {
                flex-direction: column;
                gap: 12px;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="error-container">
        
        <!-- Ícone Visual (SVG Simples de um link quebrado) -->
        <div class="broken-link-icon">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M10 13.6C10.6133 14.6667 11.6133 15.2 13 15.2C14.8667 15.2 16.4 13.6667 16.4 11.8C16.4 10.9333 16.0667 10.1333 15.5333 9.53333M14 10.4C13.3867 9.33333 12.3867 8.8 11 8.8C9.13333 8.8 7.6 10.3333 7.6 12.2C7.6 13.0667 7.93333 13.8667 8.46667 14.4667" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M20 20L4 4" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </div>

        <div class="error-code">404</div>
        
        <h1>Ops! Transferência Falhou.</h1>
        
        <p>
            A página que você está procurando parece ter sido "cancelada" ou mudou de endereço.<br>
            Verifique a URL ou utilize os botões abaixo para navegar.
        </p>

        <div class="action-buttons">
            <!-- Link para voltar à página inicial (gerador) -->
            <a href="/pix" class="btn btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 18V6M12 6L6 12M12 6L18 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Voltar ao Gerador
            </a>

        </div>

    </div>

</body>
</html>
