<style>

:root{
    --bg:#08090d;
    --bg2:#10121a;
    --card:#151821;
    --text:#ffffff;
    --muted:#9da3b0;

    --purple:#6510a0;
    --blue:#087fc0;
    --red:#e52b32;
    --indigo:#4355c9;
    --orange:#ff7900;
    --yellow:#f5a000;

    --radius:18px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;

    font-family:'Poppins',sans-serif;

    color:var(--text);

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(110,30,180,.20),
            transparent 38%
        ),
        radial-gradient(
            circle at 0% 100%,
            rgba(0,130,255,.08),
            transparent 35%
        ),
        var(--bg);

    padding:28px 18px 20px;

    overflow-x:hidden;
}


/* ========================================
   CONTAINER
======================================== */

.container{
    width:100%;
    max-width:1050px;
    margin:0 auto;
}


/* ========================================
   CABEÇALHO
======================================== */

header{
    text-align:center;
    margin-bottom:32px;
}

.logo{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    width:58px;
    height:58px;

    margin-bottom:12px;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            #7b1bc2,
            #3c0870
        );

    box-shadow:
        0 10px 35px rgba(105,20,180,.35),
        inset 0 1px rgba(255,255,255,.18);

    font-size:25px;
    font-weight:700;

    animation:logoFloat 4s ease-in-out infinite;
}

.logo i{
    filter:drop-shadow(0 2px 5px rgba(0,0,0,.3));
}

h1{
    font-size:clamp(24px,4vw,34px);
    font-weight:700;

    letter-spacing:-.6px;

    margin-bottom:3px;
}

.subtitle{
    color:var(--muted);
    font-size:14px;
}

.subtitle span{
    color:#b96df2;
}


/* ========================================
   GRID
======================================== */

.buttons-grid{
    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(240px,1fr));

    gap:16px;

    width:100%;
}


/* ========================================
   BOTÕES
======================================== */

.button{
    position:relative;

    display:flex;
    align-items:center;

    min-height:82px;

    padding:15px 18px;

    border-radius:var(--radius);

    color:#fff;

    text-decoration:none;

    overflow:hidden;

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
        0 8px 25px rgba(0,0,0,.28),
        inset 0 1px rgba(255,255,255,.12);

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        filter .25s ease;
}


/* brilho interno */

.button::before{
    content:"";

    position:absolute;

    width:150px;
    height:150px;

    top:-90px;
    right:-50px;

    border-radius:50%;

    background:rgba(255,255,255,.13);

    filter:blur(8px);

    transition:.35s;
}


/* brilho passando */

.button::after{
    content:"";

    position:absolute;

    top:0;
    left:-120%;

    width:70%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.12),
            transparent
        );

    transform:skewX(-20deg);

    transition:.6s;
}


/* hover */

.button:hover{
    transform:translateY(-4px);

    box-shadow:
        0 15px 35px rgba(0,0,0,.38),
        0 0 25px rgba(255,255,255,.04);

    filter:brightness(1.08);
}

.button:hover::after{
    left:130%;
}

.button:hover::before{
    transform:scale(1.5);
}


/* clique */

.button:active{
    transform:scale(.97);
}


/* foco para TV / teclado */

.button:focus-visible{
    outline:none;

    transform:translateY(-4px) scale(1.015);

    box-shadow:
        0 0 0 3px rgba(255,255,255,.9),
        0 0 0 7px rgba(120,50,200,.7),
        0 15px 35px rgba(0,0,0,.4);
}


/* ========================================
   ÍCONE
======================================== */

.button i{
    position:relative;
    z-index:2;

    display:flex;
    align-items:center;
    justify-content:center;

    width:48px;
    height:48px;

    flex-shrink:0;

    border-radius:14px;

    background:rgba(0,0,0,.18);

    border:1px solid rgba(255,255,255,.12);

    font-size:20px;

    box-shadow:
        inset 0 1px rgba(255,255,255,.12);
}


/* ========================================
   TEXTO
======================================== */

.btn-text{
    position:relative;
    z-index:2;

    display:flex;
    flex-direction:column;

    text-align:left;

    margin-left:14px;

    min-width:0;
}

.btn-text strong{
    font-size:16px;
    font-weight:600;

    line-height:1.25;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.btn-text small{
    margin-top:3px;

    color:rgba(255,255,255,.72);

    font-size:12px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}


/* ========================================
   CORES
======================================== */

.button1{
    background:
        linear-gradient(
            135deg,
            #7414a9,
            #4c0878
        );
}

.button2{
    background:
        linear-gradient(

            #0796d5,
            #045d9a
        );
}

.button3{
    background:
        linear-gradient(
            135deg,
            #27303d,
            #121720
        );
}

.button4{
    background:
        linear-gradient(
            135deg,
            #f13339,
            #b30e19
        );
}

.button5{
    background:
        linear-gradient(
            135deg,
            #5365dc,
            #303e9d
        );
}

.button6{
    background:
        linear-gradient(
            135deg,
            #ff8b19,
            #dc5900
        );
}

.button7{
    background:
        linear-gradient(
            135deg,
            #ffb000,
            #db7800
        );
}


/* ========================================
   FOOTER
======================================== */

footer{
    text-align:center;

    margin-top:34px;
    padding-top:22px;

    border-top:1px solid rgba(255,255,255,.06);

    color:#737985;

    font-size:12px;
}

footer a{
    color:#a867d4;

    text-decoration:none;

    font-weight:500;

    transition:.2s;
}

footer a:hover{
    color:#d39bf4;
}


/* ========================================
   ANIMAÇÕES
======================================== */

@keyframes logoFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-4px);
    }
}


/* entrada dos cards */

.button{
    animation:
        cardIn .45s ease both;
}

.button:nth-child(1){animation-delay:.03s}
.button:nth-child(2){animation-delay:.06s}
.button:nth-child(3){animation-delay:.09s}
.button:nth-child(4){animation-delay:.12s}
.button:nth-child(5){animation-delay:.15s}
.button:nth-child(6){animation-delay:.18s}
.button:nth-child(7){animation-delay:.21s}

@keyframes cardIn{

    from{
        opacity:0;
        transform:translateY(12px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* ========================================
   CELULAR
======================================== */

@media(max-width:600px){

    body{
        padding:
            22px
            13px
            18px;
    }

    header{
        margin-bottom:25px;
    }

    .logo{
        width:52px;
        height:52px;
        border-radius:16px;
        font-size:22px;
    }

    h1{
        font-size:25px;
    }

    .subtitle{
        font-size:13px;
    }

    .buttons-grid{
        grid-template-columns:1fr;
        gap:12px;
    }

    .button{
        min-height:74px;
        padding:13px 15px;
    }

    .button i{
        width:44px;
        height:44px;
        border-radius:12px;
        font-size:18px;
    }

    .btn-text{
        margin-left:12px;
    }

    .btn-text strong{
        font-size:15px;
    }

    .btn-text small{
        font-size:11px;
    }

    footer{
        margin-top:28px;
    }
}


/* ========================================
   TABLET
======================================== */

@media(min-width:601px) and (max-width:900px){

    .buttons-grid{
        grid-template-columns:
            repeat(2,1fr);
    }

}


/* ========================================
   TELAS GRANDES / TV
======================================== */

@media(min-width:1200px){

    body{
        padding-top:50px;
    }

    .container{
        max-width:1050px;
    }

    .buttons-grid{
        grid-template-columns:
            repeat(3,1fr);
    }

    .button{
        min-height:88px;
    }

}


/* ========================================
   REDUZIR ANIMAÇÕES
======================================== */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation:none !important;
        transition:none !important;
    }

}

</style>

<script>

/*
    Pequeno efeito de navegação para TV Box,
    teclado e controle remoto.

    As setas podem navegar pelos aplicativos
    e ENTER abre o aplicativo selecionado.
*/

const buttons = [...document.querySelectorAll('.button')];

let current = 0;

function focusButton(index){

    if(!buttons.length) return;

    current =
        (index + buttons.length)
        % buttons.length;

    buttons[current].focus({
        preventScroll:false
    });
}


document.addEventListener('keydown', function(event){

    if(!buttons.length) return;

    const columns =
        window.innerWidth >= 1200 ? 3 :
        window.innerWidth >= 601 ? 2 : 1;


    if(event.key === 'ArrowRight'){

        event.preventDefault();

        focusButton(current + 1);

    }


    if(event.key === 'ArrowLeft'){

        event.preventDefault();

        focusButton(current - 1);

    }


    if(event.key === 'ArrowDown'){

        event.preventDefault();

        focusButton(current + columns);

    }


    if(event.key === 'ArrowUp'){

        event.preventDefault();

        focusButton(current - columns);

    }

});


/*
    Primeiro botão recebe foco somente
    quando estiver usando teclado/controle.
*/

document.addEventListener('keydown', function(event){

    if(
        event.key === 'ArrowRight' ||
        event.key === 'ArrowLeft' ||
        event.key === 'ArrowUp' ||
        event.key === 'ArrowDown'
    ){

        if(document.activeElement === document.body){

            focusButton(0);

        }

    }

});

</script>
