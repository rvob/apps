<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lanches do Rangel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--primary:#e63946;--primary-dark:#c92f3b;--bg:#f6f6f6;--card:#fff;--text:#171717;--muted:#707070;--border:#e9e9e9}body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);padding-bottom:90px}header{background:#111;color:#fff;padding:25px 16px 20px}.header-content{max-width:1050px;margin:auto}.logo{font-size:28px;font-weight:800}.subtitle{margin-top:5px;color:#ccc;font-size:14px}.status{display:inline-flex;align-items:center;gap:7px;margin-top:14px;background:#1f1f1f;padding:8px 12px;border-radius:20px;font-size:13px}.status-dot{width:8px;height:8px;background:#29c46a;border-radius:50%}main{max-width:1050px;margin:auto;padding:20px 16px}.categories{display:flex;gap:9px;overflow-x:auto;margin-bottom:22px;scrollbar-width:none}.categories::-webkit-scrollbar{display:none}.category{border:1px solid var(--border);background:#fff;padding:10px 16px;border-radius:22px;white-space:nowrap;cursor:pointer;font-weight:600}.category.active{background:var(--primary);color:#fff;border-color:var(--primary)}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.product{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}.product-image{height:180px;background:#eee;overflow:hidden}.product-image img{width:100%;height:100%;object-fit:cover;display:block}.placeholder{height:100%;display:flex;align-items:center;justify-content:center;font-size:48px;background:linear-gradient(135deg,#ddd,#f4f4f4)}.product-content{padding:15px;display:flex;flex-direction:column;gap:8px;flex:1}.product-title{font-size:18px}.product-description{font-size:13px;color:var(--muted);line-height:1.4;flex:1}.product-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:5px}.price{font-size:17px;font-weight:800}.add-button{border:none;background:var(--primary);color:white;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer}.add-button:hover{background:var(--primary-dark)}.cart-bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(620px,calc(100% - 24px));background:#111;color:#fff;border-radius:15px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 30px #0003;z-index:10}.cart-info{font-size:13px}.cart-total{font-size:17px;font-weight:800;margin-top:2px}.cart-button{border:none;background:var(--primary);color:#fff;padding:12px 16px;border-radius:10px;font-weight:800;cursor:pointer}.modal-background{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal-background.show{display:flex}.modal{background:#fff;width:min(620px,100%);max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px}.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.close-button{border:none;background:#eee;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer}.cart-items{display:flex;flex-direction:column;gap:10px;margin-bottom:15px}.cart-item{border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}.item-name{font-weight:700}.item-price{margin-top:4px;font-weight:700}.quantity{display:flex;align-items:center;gap:8px}.quantity button{width:30px;height:30px;border:1px solid #ddd;background:white;border-radius:8px;cursor:pointer}.summary{border-top:1px solid var(--border);padding-top:14px;margin-top:8px}.summary-row{display:flex;justify-content:space-between;margin:7px 0}.total{font-size:20px;font-weight:800}form{margin-top:18px;display:grid;gap:11px}label{font-size:13px;font-weight:700}input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}textarea{resize:vertical;min-height:70px}.whatsapp-button{border:none;background:#19a957;color:white;padding:14px;border-radius:11px;font-size:16px;font-weight:800;cursor:pointer;margin-top:5px}.empty-cart{text-align:center;color:var(--muted);padding:25px}.error{text-align:center;padding:40px;background:#fff;border:1px solid var(--border);border-radius:16px;color:#777}.search{width:100%;padding:13px 15px;border:1px solid var(--border);border-radius:12px;margin-bottom:14px;font-size:15px}@media(max-width:760px){.products{grid-template-columns:repeat(2,1fr)}.product-image{height:135px}}@media(max-width:470px){main{padding:16px 12px}.products{grid-template-columns:repeat(2,1fr);gap:10px}.product-image{height:105px}.product-content{padding:10px}.product-title{font-size:16px}.product-description{font-size:12px}.price{font-size:15px}.add-button{padding:9px 11px}.logo{font-size:24px}}
</style>
</head>
<body>
<header><div class="header-content"><div class="logo">🍔 Lanches do Rangel</div><div class="subtitle">Peça seu lanche de forma rápida e fácil</div><div class="status"><span class="status-dot"></span>Aberto agora</div></div></header>
<main>
<input id="search" class="search" type="search" placeholder="🔎 Procurar lanche...">
<div class="categories" id="categories"></div>
<section class="products" id="products"></section>
</main>
<div class="cart-bar"><div><div class="cart-info" id="cartInfo">0 itens no pedido</div><div class="cart-total" id="cartTotal">R$ 0,00</div></div><button class="cart-button" onclick="openCart()">VER PEDIDO</button></div>
<div class="modal-background" id="modalBackground" onclick="closeOutside(event)"><div class="modal"><div class="modal-header"><h2>Seu pedido</h2><button class="close-button" onclick="closeCart()">×</button></div><div class="cart-items" id="cartItems"></div><div class="summary"><div class="summary-row"><span>Subtotal</span><strong id="modalSubtotal">R$ 0,00</strong></div><div class="summary-row total"><span>Total</span><span id="modalTotal">R$ 0,00</span></div></div><form id="orderForm"><div><label>Nome</label><input id="name" required placeholder="Seu nome"></div><div><label>Endereço</label><input id="address" required placeholder="Rua / avenida"></div><div><label>Número</label><input id="number" required placeholder="Número"></div><div><label>Forma de pagamento</label><select id="payment"><option>Pix</option><option>Dinheiro</option><option>Cartão</option></select></div><div><label>Troco para</label><input id="change" placeholder="Ex.: R$ 50,00"></div><div><label>Observação</label><textarea id="note" placeholder="Ex.: sem cebola..."></textarea></div><button type="submit" class="whatsapp-button">🟢 ENVIAR PEDIDO PELO WHATSAPP</button></form></div></div>
<script>
const WHATSAPP="5574999999999";
let produtos=[],categoriaAtual="Todos",carrinho=[],busca="";
const money=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
async function carregarProdutos(){try{const r=await fetch("produtos.json",{cache:"no-store"});if(!r.ok)throw new Error();produtos=await r.json();produtos=produtos.filter(p=>p.disponivel!==false);renderCategorias();renderProdutos();atualizarCarrinho()}catch(e){document.getElementById("products").innerHTML='<div class="error"><h3>Não foi possível carregar o cardápio.</h3><p style="margin-top:8px">Verifique se o arquivo <b>produtos.json</b> está no mesmo local do index.html.</p></div>'}}
function renderCategorias(){const cats=["Todos",...new Set(produtos.map(p=>p.categoria))];document.getElementById("categories").innerHTML=cats.map(c=>`<button class="category ${c===categoriaAtual?"active":""}" onclick="selecionarCategoria('${c.replace(/'/g,"\\'")}')">${c}</button>`).join("")}
function selecionarCategoria(c){categoriaAtual=c;renderCategorias();renderProdutos()}
function renderProdutos(){let lista=categoriaAtual==="Todos"?produtos:produtos.filter(p=>p.categoria===categoriaAtual);if(busca)lista=lista.filter(p=>(p.nome+" "+p.descricao+" "+p.categoria).toLowerCase().includes(busca.toLowerCase()));const el=document.getElementById("products");if(!lista.length){el.innerHTML='<div class="error">Nenhum produto encontrado.</div>';return}el.innerHTML=lista.map(p=>`<article class="product"><div class="product-image">${p.imagem?`<img src="${p.imagem}" alt="${p.nome}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:''}<div class="placeholder" style="${p.imagem?'display:none':''}">🍔</div></div><div class="product-content"><h3 class="product-title">${p.nome}</h3><p class="product-description">${p.descricao}</p><div class="product-bottom"><span class="price">${money(p.preco)}</span><button class="add-button" onclick="addItem(${p.id})">+ Adicionar</button></div></div></article>`).join("")}
function addItem(id){const item=carrinho.find(i=>i.id===id);if(item)item.qtd++;else{const p=produtos.find(p=>p.id===id);if(p)carrinho.push({...p,qtd:1})}atualizarCarrinho()}
function alterarQuantidade(id,v){const item=carrinho.find(i=>i.id===id);if(!item)return;item.qtd+=v;if(item.qtd<=0)carrinho=carrinho.filter(i=>i.id!==id);atualizarCarrinho();renderCarrinho()}
function total(){return carrinho.reduce((s,i)=>s+i.preco*i.qtd,0)}
function quantidade(){return carrinho.reduce((s,i)=>s+i.qtd,0)}
function atualizarCarrinho(){const q=quantidade();document.getElementById("cartInfo").textContent=`${q} ${q===1?"item":"itens"} no pedido`;document.getElementById("cartTotal").textContent=money(total())}
function renderCarrinho(){const box=document.getElementById("cartItems");box.innerHTML=carrinho.length?carrinho.map(i=>`<div class="cart-item"><div><div class="item-name">${i.nome}</div><div class="item-price">${money(i.preco*i.qtd)}</div></div><div class="quantity"><button onclick="alterarQuantidade(${i.id},-1)">−</button><strong>${i.qtd}</strong><button onclick="alterarQuantidade(${i.id},1)">+</button></div></div>`).join(""):'<div class="empty-cart">Seu pedido está vazio.</div>';document.getElementById("modalSubtotal").textContent=money(total());document.getElementById("modalTotal").textContent=money(total())}
function openCart(){renderCarrinho();document.getElementById("modalBackground").classList.add("show")}
function closeCart(){document.getElementById("modalBackground").classList.remove("show")}
function closeOutside(e){if(e.target.id==="modalBackground")closeCart()}
document.getElementById("search").addEventListener("input",e=>{busca=e.target.value;renderProdutos()});
document.getElementById("orderForm").addEventListener("submit",e=>{e.preventDefault();if(!carrinho.length){alert("Adicione pelo menos um produto.");return}const nome=document.getElementById("name").value,endereco=document.getElementById("address").value,numero=document.getElementById("number").value,pagamento=document.getElementById("payment").value,troco=document.getElementById("change").value,obs=document.getElementById("note").value;let msg="🍔 *NOVO PEDIDO*%0A%0A*ITENS:*%0A";carrinho.forEach(i=>msg+=`${i.qtd}x ${i.nome} — ${money(i.preco*i.qtd)}%0A`);msg+=`%0A💰 *TOTAL: ${money(total())}*%0A%0A👤 *Nome:* ${nome}%0A📍 *Endereço:* ${endereco}, ${numero}%0A💳 *Pagamento:* ${pagamento}%0A`;if(troco)msg+=`💵 *Troco para:* ${troco}%0A`;if(obs)msg+=`📝 *Observação:* ${obs}%0A`;window.open(`https://wa.me/${WHATSAPP}?text=${msg}`,"_blank")});
carregarProdutos();
</script>
</body>
</html>
