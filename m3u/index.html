<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Links M3U</title>

  <meta name="theme-color" content="#08090d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Links M3U" />

  <!-- Fonts e FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --bg: #08090d;
      --card-bg: rgba(255, 255, 255, 0.03);
      --input-bg: rgba(0, 0, 0, 0.35);
      --border-color: rgba(255, 255, 255, 0.1);
      --text-main: #ffffff;
      --text-muted: #9da3b0;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% -10%, rgba(110, 30, 180, .20), transparent 40%), var(--bg);
      color: var(--text-main);
      font-family: 'Poppins', sans-serif;
      padding: 16px 12px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 16px;
      border-radius: var(--radius);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      height: fit-content;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #7b1bc2, #3c0870);
      box-shadow: 0 4px 15px rgba(105, 20, 180, .35);
      font-size: 16px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -.5px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    label {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: block;
    }

    input {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-family: 'Poppins', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #b96df2;
    }

    .btn {
      width: 100%;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, filter 0.2s;
      background: linear-gradient(135deg, #7414a9, #4c0878);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, .25);
    }

    .btn:active {
      transform: scale(.98);
    }

    #resultado {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .grupo-site {
      background-color: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .titulo-site {
      font-size: 0.85rem;
      font-weight: 700;
      color: #b96df2;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      gap: 6px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .linha {
      background-color: var(--input-bg);
      padding: 8px 10px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .texto-container {
      flex: 1;
      min-width: 0;
    }

    .label-tipo {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-muted);
      line-height: 1;
      margin-bottom: 2px;
      display: block;
    }

    .texto-link {
      font-family: monospace;
      font-size: 0.78rem;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .copiar-btn {
      background: linear-gradient(135deg, #0796d5, #045d9a);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .copiar-btn.copiado {
      background: linear-gradient(135deg, #10b981, #047857);
    }

    @media (max-width: 380px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <i class="fa-solid fa-link"></i>
      </div>
      <h1>Links M3U</h1>
    </header>

    <div class="form-grid">
      <div>
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" placeholder="Usuário" />
      </div>

      <div>
        <label for="senha">Senha</label>
        <input type="text" id="senha" placeholder="Senha" />
      </div>
    </div>

    <button class="btn" onclick="gerarLinks()">Gerar Links</button>

    <div id="resultado"></div>
  </div>

  <script>
    function gerarLinks() {
      const usuario = document.getElementById('usuario').value.trim();
      const senha = document.getElementById('senha').value.trim();

      const sites = [
        "clubneymar.com",
        "diogoguido.com",
        "mevergiveupp.com",
        "phn35.xyz",
        "uabckiac.com",
        "ueropqe.com"
      ];

      const resultadoDiv = document.getElementById('resultado');
      resultadoDiv.innerHTML = '';

      if (!usuario || !senha) {
        alert('Por favor, preencha o usuário e a senha.');
        return;
      }

      sites.forEach(site => {
        const siteLimpo = site.replace(/\/$/, '');

        const grupo = document.createElement('div');
        grupo.className = 'grupo-site';

        const titulo = document.createElement('div');
        titulo.className = 'titulo-site';
        titulo.innerHTML = `<i class="fa-solid fa-globe"></i> ${siteLimpo}`;
        grupo.appendChild(titulo);

        const itens = [
          { tipo: 'M3U', url: `http://${siteLimpo}/get.php?username=${usuario}&password=${senha}&type=m3u_plus&output=ts` },
          { tipo: 'EPG', url: `http://${siteLimpo}/epg/${usuario}/${senha}` }
        ];

        itens.forEach(item => {
          const linha = document.createElement('div');
          linha.className = 'linha';

          linha.innerHTML = `
            <div class="texto-container">
              <span class="label-tipo">${item.tipo}</span>
              <div class="texto-link" title="${item.url}">${item.url}</div>
            </div>
            <button class="copiar-btn"><i class="fa-regular fa-copy"></i> Copiar</button>
          `;

          const botao = linha.querySelector('.copiar-btn');

          botao.onclick = () => {
            navigator.clipboard.writeText(item.url);
            botao.innerHTML = '<i class="fa-solid fa-check"></i> OK!';
            botao.classList.add('copiado');

            setTimeout(() => {
              botao.innerHTML = '<i class="fa-regular fa-copy"></i> Copiar';
              botao.classList.remove('copiado');
            }, 1500);
          };

          grupo.appendChild(linha);
        });

        resultadoDiv.appendChild(grupo);
      });
    }

    // Registro do Service Worker (Necessário para o PWA no Chrome / Android)
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
        self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);

      navigator.serviceWorker.register(swUrl).catch(err => console.log('SW error:', err));
    }
  </script>
</body>
</html>
